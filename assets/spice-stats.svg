<svg width="1200" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Arrakis operations: spice harvested 12.4K, commits this cycle 527, sietches built 15 plus, fremen eyes infinite">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16100a"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <filter id="emberBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <style>
    .card { opacity: 0; animation: riseIn 0.7s ease-out forwards; }
    .c1 { animation-delay: 0.1s; }
    .c2 { animation-delay: 0.25s; }
    .c3 { animation-delay: 0.4s; }
    .c4 { animation-delay: 0.55s; }
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0px); }
    }
    .ember { animation: breathe 6s ease-in-out infinite alternate; }
    .e1 { animation-delay: 0s; }
    .e2 { animation-delay: -1.5s; }
    .e3 { animation-delay: -3s; }
    .e4 { animation-delay: -4.5s; }
    @keyframes breathe {
      from { opacity: 0.15; }
      to   { opacity: 0.4; }
    }
    .eye {
      animation: blink 9s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes blink {
      0%   { transform: scaleY(1); }
      40%  { transform: scaleY(1); }
      44%  { transform: scaleY(0.08); }
      48%  { transform: scaleY(1); }
      86%  { transform: scaleY(1); }
      90%  { transform: scaleY(0.08); }
      94%  { transform: scaleY(1); }
      100% { transform: scaleY(1); }
    }
    .lbl {
      font-family: Copperplate, "Trajan Pro", Georgia, serif;
      font-size: 11px;
      letter-spacing: 3px;
      fill: #D4A574;
    }
    .val {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 24px;
      font-weight: bold;
      fill: #E8DCC4;
    }
  </style>

  <!-- Card 1 : Spice Harvested -->
  <g class="card c1">
    <rect class="ember e1" x="24" y="16" width="270" height="118" rx="14" fill="#C2622D" filter="url(#emberBlur)"/>
    <rect x="24" y="16" width="270" height="118" rx="12" fill="url(#cardGrad)" stroke="#D4A574" stroke-opacity="0.55" stroke-width="1"/>
    <g transform="translate(159,41)" stroke="#D4A574" stroke-width="2" stroke-linejoin="round" fill="#C2622D" fill-opacity="0.25">
      <path d="M0 -12 L4 -6.5 L0 -1 L-4 -6.5 Z"/>
      <path d="M-7.5 0 L-3.5 5.5 L-7.5 11 L-11.5 5.5 Z"/>
      <path d="M7.5 0 L11.5 5.5 L7.5 11 L3.5 5.5 Z"/>
    </g>
    <text class="lbl" x="159" y="86" text-anchor="middle">SPICE HARVESTED</text>
    <text class="val" x="159" y="110" text-anchor="middle">12.4K</text>
  </g>

  <!-- Card 2 : Commits This Cycle -->
  <g class="card c2">
    <rect class="ember e2" x="318" y="16" width="270" height="118" rx="14" fill="#C2622D" filter="url(#emberBlur)"/>
    <rect x="318" y="16" width="270" height="118" rx="12" fill="url(#cardGrad)" stroke="#D4A574" stroke-opacity="0.55" stroke-width="1"/>
    <g transform="translate(453,41)" stroke="#D4A574" stroke-width="2" fill="none" stroke-linecap="round">
      <circle r="7.5"/>
      <circle r="2.5" fill="#C2622D" fill-opacity="0.25"/>
      <line x1="8.5" y1="0" x2="11.5" y2="0"/>
      <line x1="8.5" y1="0" x2="11.5" y2="0" transform="rotate(45)"/>
      <line x1="8.5" y1="0" x2="11.5" y2="0" transform="rotate(90)"/>
      <line x1="8.5" y1="0" x2="11.5" y2="0" transform="rotate(135)"/>
      <line x1="8.5" y1="0" x2="11.5" y2="0" transform="rotate(180)"/>
      <line x1="8.5" y1="0" x2="11.5" y2="0" transform="rotate(225)"/>
      <line x1="8.5" y1="0" x2="11.5" y2="0" transform="rotate(270)"/>
      <line x1="8.5" y1="0" x2="11.5" y2="0" transform="rotate(315)"/>
    </g>
    <text class="lbl" x="453" y="86" text-anchor="middle">COMMITS THIS CYCLE</text>
    <text class="val" x="453" y="110" text-anchor="middle">527</text>
  </g>

  <!-- Card 3 : Sietches Built -->
  <g class="card c3">
    <rect class="ember e3" x="612" y="16" width="270" height="118" rx="14" fill="#C2622D" filter="url(#emberBlur)"/>
    <rect x="612" y="16" width="270" height="118" rx="12" fill="url(#cardGrad)" stroke="#D4A574" stroke-opacity="0.55" stroke-width="1"/>
    <g transform="translate(747,42)" stroke="#D4A574" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
      <path d="M-16 10 L-6 -10 L0 -3 L7 -12 L17 10" fill="#C2622D" fill-opacity="0.18"/>
      <path d="M-16 10 L-2 10 L-2 3.5 L2 3.5 L2 10 L17 10" fill="none"/>
    </g>
    <text class="lbl" x="747" y="86" text-anchor="middle">SIETCHES BUILT</text>
    <text class="val" x="747" y="110" text-anchor="middle">15+</text>
  </g>

  <!-- Card 4 : Fremen Eyes -->
  <g class="card c4">
    <rect class="ember e4" x="906" y="16" width="270" height="118" rx="14" fill="#C2622D" filter="url(#emberBlur)"/>
    <rect x="906" y="16" width="270" height="118" rx="12" fill="url(#cardGrad)" stroke="#D4A574" stroke-opacity="0.55" stroke-width="1"/>
    <g transform="translate(1041,41)">
      <g class="eye">
        <path d="M-15 0 Q0 -10.5 15 0 Q0 10.5 -15 0 Z" stroke="#D4A574" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <circle r="4.5" fill="#00B4D8" fill-opacity="0.8"/>
      </g>
    </g>
    <text class="lbl" x="1041" y="86" text-anchor="middle">FREMEN EYES</text>
    <path d="M1026.5 102 a8 8 0 1 0 16 0 a8 8 0 1 0 -16 0 M1039.5 102 a8 8 0 1 0 16 0 a8 8 0 1 0 -16 0" stroke="#E8DCC4" stroke-width="2.5" fill="none"/>
  </g>
</svg>