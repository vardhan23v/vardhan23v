name: refresh stats

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  stats:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: regenerate stats cards
        run: python3 scripts/generate_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/spice-github-stats.svg assets/spice-langs.svg
          git diff --cached --quiet || { git commit -m "🔄 Refresh spice stats cards"; git push; }
